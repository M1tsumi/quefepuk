<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} Docs - quefep</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="keywords" content="{{TITLE}}, documentation, {{LANGUAGE_LABEL}}, quefep, M1tsumi">
    <meta name="author" content="quefep">
    <link rel="canonical" href="https://quefep.uk/docs/{{SLUG}}">
    <link rel="icon" type="image/png" href="https://static.planetminecraft.com/files/avatar/5875422_1.png">
    <meta property="og:title" content="{{TITLE}} Docs - quefep">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="https://quefep.uk/docs/{{SLUG}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="quefep">
    <meta property="og:image" content="https://static.planetminecraft.com/files/avatar/5875422_1.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@thats_alot">
    <meta name="twitter:creator" content="@thats_alot">
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
</head>
<body>
    <div class="container">
        <nav class="nav-header">
            <a href="/" class="nav-logo">quefep</a>
            <div style="display:flex;gap:0.25rem;">
                <a href="/blog" class="nav-link">blog</a>
                <a href="/docs" class="nav-link" style="color:var(--accent);">docs</a>
            </div>
        </nav>

        <main>
            <a href="/docs" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                All docs
            </a>

            <div class="docs-page">
                <!-- Sidebar -->
                <aside class="docs-sidebar">
                    <div class="docs-sidebar-title">On this page</div>
                    <input type="text" id="docs-search" placeholder="Search docs..." autocomplete="off" style="width:100%;padding:0.45rem 0.65rem;margin-bottom:0.5rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-secondary);color:var(--text-primary);font-size:0.8125rem;font-family:inherit;outline:none;box-sizing:border-box;">
                    <div id="docs-search-results" style="display:none;margin-bottom:0.5rem;max-height:28vh;overflow:auto;padding:0.25rem 0;border-radius:6px;"></div>
                    <p id="docs-search-empty" style="display:none;font-size:0.8rem;color:var(--text-muted);margin:0 0 0.5rem;">No results found.</p>
                    <ul class="docs-sidebar-nav" id="sidebar-nav">
                        {{SIDEBAR_NAV}}
                    </ul>
                </aside>

                <!-- Main content -->
                <div class="docs-main">
                    <header class="docs-page-header">
                        <div class="docs-page-icon {{LANGUAGE}}">{{LANGUAGE_LABEL}}</div>
                        <div>
                            <h1 class="docs-page-title">{{TITLE}}</h1>
                            <p class="docs-page-subtitle">{{DESCRIPTION}}</p>
                            <div class="docs-page-badges">
                                <span class="docs-badge lang {{LANGUAGE}}">{{LANGUAGE_LABEL}}</span>
                                <span class="docs-badge">v{{VERSION}}</span>
                                {{TAGS}}
                            </div>
                            {{GITHUB_LINK}}
                        </div>
                    </header>

                    <div class="docs-content" id="docs-content">
                        {{CONTENT}}
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 quefep. Built with care.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Syntax highlighting
            hljs.configure({ ignoreUnescapedHTML: true });
            hljs.highlightAll();

            // Add copy buttons to code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                const pre = block.parentElement;
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const header = document.createElement('div');
                header.className = 'code-header';

                const lang = block.className.match(/language-(\w+)/)?.[1] || 'code';
                header.innerHTML = `
                    <span class="code-language">${lang}</span>
                    <button class="copy-button">Copy</button>
                `;
                wrapper.insertBefore(header, pre);

                header.querySelector('.copy-button').addEventListener('click', () => {
                    navigator.clipboard.writeText(block.textContent).then(() => {
                        const btn = header.querySelector('.copy-button');
                        btn.textContent = 'Copied!';
                        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
                    });
                });
            });

            // Sidebar active-link tracking
            const sections = document.querySelectorAll('.docs-section[id]');
            const navLinks = document.querySelectorAll('.docs-sidebar-link');

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        navLinks.forEach(link => {
                            link.classList.toggle(
                                'active',
                                link.getAttribute('href') === `#${entry.target.id}`
                            );
                        });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            sections.forEach(s => observer.observe(s));

            // Search filtering
            const searchInput = document.getElementById('docs-search');
            const searchEmpty = document.getElementById('docs-search-empty');
            let docsIndex = null;
            const resultsContainer = document.getElementById('docs-search-results');

            // Attempt to fetch a prebuilt search index for faster results
            fetch('/docs/docs-search-index.json').then(r => {
                if (!r.ok) throw new Error('no index');
                return r.json();
            }).then(idx => {
                docsIndex = idx || null;
            }).catch(() => {
                docsIndex = null; // fallback to DOM scanning
            });
            if (searchInput) {
                searchInput.addEventListener('input', () => {
                    const term = searchInput.value.toLowerCase().trim();
                    // If we have an index, show quick results
                    if (docsIndex && term.length >= 2) {
                        const results = docsIndex.filter(item => {
                            return item.title.toLowerCase().includes(term) || (item.snippet && item.snippet.toLowerCase().includes(term));
                        }).slice(0, 40);
                        resultsContainer.innerHTML = '';
                        if (results.length === 0) {
                            resultsContainer.style.display = 'none';
                            if (searchEmpty) searchEmpty.style.display = 'block';
                            return;
                        }
                        searchEmpty.style.display = 'none';
                        resultsContainer.style.display = '';
                        for (const r of results) {
                            const a = document.createElement('a');
                            a.href = `/docs/${encodeURIComponent(r.slug)}#${encodeURIComponent(r.id)}`;
                            a.className = 'docs-sidebar-link';
                            a.style.display = 'block';
                            a.style.padding = '0.35rem 0.45rem';
                            a.style.color = 'var(--text-secondary)';
                            a.textContent = `${r.title} — ${r.assembly}`;
                            resultsContainer.appendChild(a);
                        }
                        return;
                    }

                    // Fallback: inline DOM scanning (existing behavior)
                    let visible = 0;
                    document.querySelectorAll('.docs-section[id]').forEach(section => {
                        const matches = !term || section.innerText.toLowerCase().includes(term);
                        section.style.display = matches ? '' : 'none';
                        const link = document.querySelector(`.docs-sidebar-link[href="#${section.id}"]`);
                        if (link) link.parentElement.style.display = matches ? '' : 'none';
                        if (matches) visible++;
                    });
                    if (searchEmpty) searchEmpty.style.display = visible === 0 ? 'block' : 'none';
                });
            }
        });
    </script>
</body>
</html>
